[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rail-codes"
version = "0.1.1"
description = "Convert UK railway station codes in Python: TIPLOC, CRS (three-letter code), NLC and STANOX, from Network Rail CORPUS."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "Dillon Rose", email = "dillonrose0@icloud.com" }]
keywords = ["tiploc", "crs", "crs-code", "station-codes", "nlc", "stanox", "corpus", "network-rail", "railway", "uk-rail", "great-britain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
rail-codes = "rail_codes.cli:main"

[project.urls]
Homepage = "https://github.com/rosedillon/rail-codes"
Documentation = "https://github.com/rosedillon/rail-codes#readme"
Source = "https://github.com/rosedillon/rail-codes"
Issues = "https://github.com/rosedillon/rail-codes/issues"
Changelog = "https://github.com/rosedillon/rail-codes/releases"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.pycodestyle]
# PEP 8: code may run to 99 when agreed, but comments and docstrings
# still wrap at 72.
max-doc-length = 72

[tool.mypy]
strict = true

[tool.setuptools.package-data]
rail_codes = ["data/*", "py.typed"]
